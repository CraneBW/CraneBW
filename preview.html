<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>横幅对比:Crane 的银河 vs NASA 银河</title>
<style>
  body { background:#070b16; color:#e2e8f0; font-family: sans-serif; margin:0; padding:24px; }

  .card { background:#0e1626; border:1px solid #1a2332; border-radius:12px; padding:16px; max-width:640px; }

  .card p { color:#94a3b8; font-size:13px; margin:8px 0 0; }
  img { width:100%; border-radius:8px; }

<body>
<h1>🌌 银河横幅对比</h1>
<div class="row">
  <div class="card">
    <h2>选项 A:你自己的摄影作品 <span class="tag">原创 · 2026.08 拍摄</span></h2>

</div>
